# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish" # UNCOMMENT THIS LINE
baseURL = "https://prisma.groningen/"
defaultContentLanguage = "en"

[menus]
  [[menus.main]]
    name = "Blog"
    url = "/posts/"
    weight = 2

  [[menus.main]]
    name = "Projects"
    url = "/projects/"
    weight = 1

  [[menus.main]]
    name = "About Us"
    url = "/about/"
    weight = 3

  [[menus.main]]
    name = "Our Team"
    parent = "About Us"
    pageRef = "/about/us"
    weight = 1

  [[menus.main]]
    name = "George Azzopardi"
    parent = "About Us"
    pageRef = "/about/george"
    weight = 2

  [[menus.main]]
  name = "Rafael"
  parent = "About Us"
  pageRef = "/about/rafael"
  weight = 10




[params]
  logo = "img/prisma_basic.png"
  secondaryLogo = "img/prisma_basic.png"


# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false

enableEmoji = true

# googleAnalytics = "G-XXXXXXXXX"

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10
#
